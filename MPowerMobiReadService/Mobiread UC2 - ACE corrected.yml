openapi: 3.0.3
info:
  title: MOBIREAD Integration API
  version: 1.0.0-draft
  description: 'REST API skeleton contract derived from the supplied **MOBIREAD Technical Analysis**. It retains all
    documented operations that are not marked red in the source document.


    **Design rules**

    - SQL table names, column names and SQL fragments are never accepted from callers. Logical enums are mapped server-side.

    - SQL parameters must be bound variables; ID lists are JSON arrays, not comma-separated SQL text.

    - GET operations return the columns projected by the documented SELECT, normalized to camelCase JSON.

    - INSERT/UPDATE operations accept JSON derived from the documented SQL inputs and return service-level mutation counts.

    - Operations marked red in the source document are excluded: queries 9, 18, 21, 22, 26, 28, 37a, 37b and 37c.
    Non-red operations remain in scope regardless of analysis notes; queries 25 and 27 execute the documented TRUNCATE statements.

    - Database datatypes, nullability, lengths, authentication, authorization and transaction boundaries were not provided;
    field types below are conservative API-level inferences and must be verified against Oracle metadata before implementation.'
servers:
- url: /api/v1/mobiread
  description: Relative base path; host is environment-specific
tags:
- name: Consumers
  description: Consumer synchronization reads and acknowledgement status.
- name: Readings
  description: Meter-reading synchronization, pending IDs and reading submission.
- name: Zones
  description: Zone and sub-zone reference data.
- name: Anomalies
  description: Anomaly reference synchronization. Destructive refresh operations require additional design review.
- name: Feeders
  description: Feeder/node synchronization.
- name: Cabins
  description: Cabin/node synchronization and cabin status updates.
- name: Utilities
  description: Pre-import validation/count checks.
paths:
  /consumers/fatura/count:
    get:
      tags:
      - Consumers
      summary: Count pending Fatura consumers
      operationId: getTotalCustomers
      description: Query 1. Counts rows in `MR.MODOWNHEADER_FATURA_NEW` where `ZZIMP = 0`.
      x-source-query: '1'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalResponse'
        '500':
          $ref: '#/components/responses/ServerError'
